        const Preparation = () => {
          const { activeTrip, updateChecklist } = useContext(AppContext);
          const [hkdRate, setHkdRate] = useState('0.052');
          const [jpyAmount, setJpyAmount] = useState(1000);
          const [newItem, setNewItem] = useState('');
          const [editingId, setEditingId] = useState(null);
          const [editingText, setEditingText] = useState('');
          const [draggedItem, setDraggedItem] = useState(null);

          const toggleCheck = (id) => updateChecklist(activeTrip.id, activeTrip.checklist.map(c => c.id === id ? { ...c, completed: !c.completed } : c));
          const addCheckItem = (e) => { e.preventDefault(); if(newItem.trim()) { updateChecklist(activeTrip.id, [...activeTrip.checklist, { id: crypto.randomUUID(), item: newItem, completed: false }]); setNewItem(''); } };
          const deleteCheckItem = (e, id) => { e.stopPropagation(); updateChecklist(activeTrip.id, activeTrip.checklist.filter(c => c.id !== id)); };
          const saveEditing = (e) => { e.stopPropagation(); if(editingText.trim()) { updateChecklist(activeTrip.id, activeTrip.checklist.map(c => c.id === editingId ? { ...c, item: editingText.trim() } : c)); } setEditingId(null); };

          const handleDragStart = (e, index) => {
              setDraggedItem(index);
              e.dataTransfer.effectAllowed = "move";
          };

          const handleDragOver = (e, index) => {
              e.preventDefault();
              if (draggedItem === null || draggedItem === index) return;
              
              const newList = [...activeTrip.checklist];
              const item = newList[draggedItem];
              newList.splice(draggedItem, 1);
              newList.splice(index, 0, item);
              
              setDraggedItem(index);
              updateChecklist(activeTrip.id, newList);
          };

          const handleDragEnd = () => {
              setDraggedItem(null);
          };

          const moveItem = (index, direction) => {
              if (direction === 'up' && index === 0) return;
              if (direction === 'down' && index === activeTrip.checklist.length - 1) return;
              const newList = [...activeTrip.checklist];
              const swapIndex = direction === 'up' ? index - 1 : index + 1;
              [newList[index], newList[swapIndex]] = [newList[swapIndex], newList[index]];
              updateChecklist(activeTrip.id, newList);
          };

          return (
            <div className="p-6 md:p-10 max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8 pb-32">
              <div className="space-y-6">
                <h2 className="text-2xl font-bold text-gray-800 dark:text-white flex items-center gap-2"><CheckCircle2 className="text-[var(--primary)]" /> 出發前準備</h2>
                <GlassCard className="min-h-[400px] flex flex-col">
                  <div className="p-4 border-b border-gray-100 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-900/50 rounded-t-3xl">
                    <form onSubmit={addCheckItem} className="flex gap-2">
                      <input value={newItem} onChange={e => setNewItem(e.target.value)} placeholder="新增準備事項..." className="flex-1 bg-white dark:bg-gray-800 dark:text-white border border-gray-200 dark:border-gray-600 rounded-xl px-3 py-2 outline-none focus:ring-1 focus:ring-[var(--primary)]"/>
                      <Button type="submit" size="sm"><Plus size={16} /></Button>
                    </form>
                  </div>
                  <div className="px-4 pt-4 pb-2">
                     <MobileDragHint />
                  </div>
                  <div className="p-2 space-y-1 flex-1 overflow-y-auto">
                     {activeTrip.checklist.map((c, index) => (
                       <div 
                         key={c.id} 
                         draggable
                         onDragStart={(e) => handleDragStart(e, index)}
                         onDragOver={(e) => handleDragOver(e, index)}
                         onDragEnd={handleDragEnd}
                         onClick={() => { if(editingId !== c.id) toggleCheck(c.id); }} 
                         className={`group flex items-center gap-3 p-3 rounded-2xl cursor-pointer transition-all duration-300 ${c.completed ? 'bg-gray-50 dark:bg-gray-900/30' : 'hover:bg-white dark:hover:bg-gray-700 hover:shadow-sm'} ${draggedItem === index ? 'opacity-50 scale-95' : 'opacity-100'}`}
                       >
                         <div className="flex flex-col items-center justify-center text-gray-300 shrink-0" onMouseDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()}>
                            <button onClick={(e) => { e.stopPropagation(); moveItem(index, 'up'); }} disabled={index === 0} className="p-0.5 hover:text-[var(--primary)] md:hidden disabled:opacity-30"><ChevronUp size={16}/></button>
                            <GripVertical size={16} className="hidden md:block cursor-move hover:text-gray-500" />
                            <button onClick={(e) => { e.stopPropagation(); moveItem(index, 'down'); }} disabled={index === activeTrip.checklist.length - 1} className="p-0.5 hover:text-[var(--primary)] md:hidden disabled:opacity-30"><ChevronDown size={16}/></button>
                         </div>
                         {editingId === c.id ? (
                           <div className="flex-1 flex items-center gap-2" onClick={e => e.stopPropagation()}>
                             <input value={editingText} onChange={e => setEditingText(e.target.value)} className="flex-1 border border-[var(--primary)] rounded-xl px-2 py-1 text-sm outline-none dark:bg-gray-800 dark:text-white" autoFocus />
                             <button onClick={saveEditing} className="p-1 text-green-600 hover:bg-green-50 rounded-full"><Check size={16}/></button>
                             <button onClick={e => {e.stopPropagation(); setEditingId(null)}} className="p-1 text-red-500 hover:bg-red-50 rounded-full"><X size={16}/></button>
                           </div>
                         ) : (
                           <>
                             <div className={`w-5 h-5 rounded-full border flex items-center justify-center shrink-0 ${c.completed ? 'bg-[var(--primary)] border-[var(--primary)] text-white' : 'border-gray-300 dark:border-gray-500'}`}>{c.completed && <CheckCircle2 size={14} />}</div>
                             <span className={`flex-1 ${c.completed ? 'text-gray-400 line-through' : 'text-gray-700 dark:text-gray-200'}`}>{c.item}</span>
                             <div className="flex items-center gap-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity">
                               <button onClick={(e) => { e.stopPropagation(); setEditingId(c.id); setEditingText(c.item); }} className="p-1.5 text-gray-400 hover:text-[var(--primary)] hover:bg-[rgba(var(--primary-rgb),0.1)] rounded-xl"><Pencil size={14} /></button>
                               <button onClick={(e) => deleteCheckItem(e, c.id)} className="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-xl"><Trash2 size={14} /></button>
                             </div>
                           </>
                         )}
                       </div>
                     ))}
                  </div>
                </GlassCard>
              </div>
              <div className="space-y-6">
                <h2 className="text-2xl font-bold text-gray-800 dark:text-white flex items-center gap-2"><ArrowRightLeft className="text-[#4D96FF]" /> 匯率換算</h2>
                <GlassCard className="p-8 space-y-8">
                   <div className="flex items-center justify-between text-sm text-gray-500 bg-gray-50 dark:bg-gray-900/50 p-3 rounded-2xl">
                     <span className="dark:text-gray-300">當前匯率參考</span>
                     <div className="font-mono dark:text-gray-200 flex items-center gap-1">
                        1 JPY ≈ 
                        <input 
                          type="number" 
                          step="0.001" 
                          value={hkdRate} 
                          onChange={e => setHkdRate(e.target.value)} 
                          className="w-20 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded-md px-2 py-0.5 text-center outline-none focus:border-[var(--primary)] focus:ring-1 focus:ring-[var(--primary)] transition-all text-gray-700 dark:text-gray-200"
                        /> 
                        HKD
                     </div>
                   </div>
                   <div className="space-y-6">
                     <div className="relative"><label className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-1 block">日圓 (JPY)</label><div className="relative"><JapaneseYen className="absolute left-3 top-3 text-gray-400" size={20} /><input type="number" value={jpyAmount} onChange={e => setJpyAmount(e.target.value)} className="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-gray-700 dark:text-white border border-gray-200 dark:border-gray-600 rounded-2xl text-xl font-bold text-gray-800 outline-none focus:ring-2 focus:ring-[var(--primary)]"/></div></div>
                     <div className="flex justify-center -my-2 z-10 relative"><div className="bg-white dark:bg-gray-800 border dark:border-gray-600 p-2 rounded-full shadow-sm text-gray-400"><ArrowRightLeft size={16} className="transform rotate-90" /></div></div>
                     <div className="relative"><label className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-1 block">港幣 (HKD)</label><div className="w-full pl-4 pr-4 py-3 bg-[#f0f9ff] dark:bg-blue-900/20 border border-blue-100 dark:border-blue-800 rounded-2xl text-2xl font-bold text-blue-800 dark:text-blue-300">$ {(jpyAmount * (Number(hkdRate) || 0)).toFixed(2)}</div></div>
                   </div>
                </GlassCard>
              </div>
            </div>
          );
        };

        const BudgetPage = () => {
          const { activeTrip, updateItinerary, updateTrip } = useContext(AppContext);
          const [editingExpense, setEditingExpense] = useState(null);
          const [showAddExpense, setShowAddExpense] = useState(false);

          // Combine both scheduled activities and saved places for total spent calculation
          const allActivities = [
            ...activeTrip.dailyItinerary.flatMap(d => d.activities.map(a => ({...a, dayId: d.day, date: d.date}))),
            ...(activeTrip.savedPlaces ? Object.entries(activeTrip.savedPlaces).flatMap(([cat, items]) => items.map(a => ({...a, isSaved: true, category: cat}))) : [])
          ];

          const spentData = allActivities.reduce((acc, act) => {
            if(act.cost > 0) {
                acc[act.type] = (acc[act.type] || 0) + act.cost; 
                acc.total += act.cost; 
            }
            return acc;
          }, { total: 0 });
          
          const pieSlices = Object.keys(ACTIVITY_TYPES).map(cat => ({ type: cat, value: spentData[cat] || 0, color: ACTIVITY_TYPES[cat].color })).filter(d => d.value > 0);
          
          let accPercent = 0;
          const svgSlices = pieSlices.map((slice, i) => {
              const p = slice.value / spentData.total;
              const dash = `${p * 100} 100`;
              const off = 25 - (accPercent * 100);
              accPercent += p;
              const color = slice.type === 'Food' ? '#FF9F1C' : slice.type === 'Sightseeing' ? '#4D96FF' : slice.type === 'Transport' ? '#10B981' : slice.type === 'Hotel' ? '#A855F7' : '#FFD93D';
              return <circle key={i} r="15.9155" cx="20" cy="20" fill="transparent" stroke={color} strokeWidth="4" strokeDasharray={dash} strokeDashoffset={off} />;
          });

          const allExpenses = allActivities.filter(act => act.cost > 0).sort((a, b) => {
              if (a.isSaved && !b.isSaved) return 1;
              if (!a.isSaved && b.isSaved) return -1;
              return (new Date(a.date) - new Date(b.date)) || (a.time || '').localeCompare(b.time || '');
          });

          const handleEditSave = (e) => {
              e.preventDefault();
              if(!editingExpense) return;
              const fd = new FormData(e.target);
              const newCost = parseInt(fd.get('cost') || 0);
              const newNotes = fd.get('notes');

              if (editingExpense.isSaved) {
                  const newSavedPlaces = { ...activeTrip.savedPlaces };
                  newSavedPlaces[editingExpense.category] = newSavedPlaces[editingExpense.category].map(act => 
                      act.id === editingExpense.id ? { ...act, cost: newCost, notes: newNotes } : act
                  );
                  updateTrip(activeTrip.id, { savedPlaces: newSavedPlaces });
              } else {
                  const newItinerary = activeTrip.dailyItinerary.map(day => {
                      if(day.day !== editingExpense.dayId) return day;
                      return {
                          ...day,
                          activities: day.activities.map(act => 
                              act.id === editingExpense.id ? { ...act, cost: newCost, notes: newNotes } : act
                          )
                      };
                  });
                  updateItinerary(activeTrip.id, newItinerary);
              }
              setEditingExpense(null);
          };

          const handleAddExpense = (e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              const date = fd.get('date');
              const type = fd.get('type');
              const cost = parseInt(fd.get('cost') || 0);
              const title = fd.get('title');
              const notes = fd.get('notes');

              const targetDay = activeTrip.dailyItinerary.find(d => d.date === date);
              
              if (targetDay) {
                  const newActivity = {
                      id: crypto.randomUUID(),
                      type: type,
                      time: '12:00',
                      location: title,
                      notes: notes,
                      cost: cost
                  };

                  const newItinerary = activeTrip.dailyItinerary.map(day => {
                      if(day.day !== targetDay.day) return day;
                      return {
                          ...day,
                          activities: [...day.activities, newActivity]
                      };
                  });
                  updateItinerary(activeTrip.id, newItinerary);
                  setShowAddExpense(false);
              } else {
                  alert('請選擇行程範圍內的日期');
              }
          };

          const handleDeleteExpense = (expense) => {
              if(!confirm("確定要刪除此筆支出嗎？\n(注意：這將會從行程表中移除此活動)")) return;
              
              if (expense.isSaved) {
                  const newSavedPlaces = { ...activeTrip.savedPlaces };
                  newSavedPlaces[expense.category] = newSavedPlaces[expense.category].filter(act => act.id !== expense.id);
                  updateTrip(activeTrip.id, { savedPlaces: newSavedPlaces });
              } else {
                  const newItinerary = activeTrip.dailyItinerary.map(day => {
                      if(day.day !== expense.dayId) return day;
                      return {
                          ...day,
                          activities: day.activities.filter(act => act.id !== expense.id)
                      };
                  });

                              </div>
                              <div>
                                  <label className="block text-xs font-bold text-gray-500 mb-1">備註</label>
                                  <input name="notes" className="w-full border dark:border-gray-700 dark:bg-gray-700 dark:text-white rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-[var(--primary)]"/>

                              <div className="flex gap-3 mt-6">
                                  <Button variant="outline" type="button" className="flex-1 justify-center" onClick={() => setShowAddExpense(false)}>取消</Button>
                                  <Button type="submit" className="flex-1 justify-center">新增</Button>
                              </div>
                          </form>

              {editingExpense && (

                            <h3 className="text-lg font-bold dark:text-white">編輯支出</h3>
                            <button onClick={() => setEditingExpense(null)} className="text-gray-400 hover:text-gray-600"><X size={20}/></button>
                        </div>
                        <div className="mb-4 p-3 bg-gray-50 dark:bg-gray-900/50 rounded-xl flex items-center gap-3">
                             <div className={`w-10 h-10 rounded-full flex items-center justify-center ${ACTIVITY_TYPES[editingExpense.type]?.bg} ${ACTIVITY_TYPES[editingExpense.type]?.color}`}>
                                {React.createElement(ACTIVITY_TYPES[editingExpense.type]?.icon || Circle, { size: 20 })}
                             </div>
                             <div>
                                 <div className="font-bold text-gray-800 dark:text-gray-200">{editingExpense.location}</div>
                                 {!editingExpense.isSaved && <div className="text-xs text-gray-500">{formatDateDisplay(editingExpense.date)} {editingExpense.time}</div>}
                                 {editingExpense.isSaved && <div className="text-xs text-gray-500">備用清單: {editingExpense.category}</div>}
                             </div>
                        </div>
                        <form onSubmit={handleEditSave} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">金額 (JPY)</label>
                                <input type="number" name="cost" defaultValue={editingExpense.cost} required className="w-full border dark:border-gray-700 dark:bg-gray-700 dark:text-white rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-[var(--primary)] text-lg font-bold"/>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1">備註</label>
                                <input name="notes" defaultValue={editingExpense.notes} className="w-full border dark:border-gray-700 dark:bg-gray-700 dark:text-white rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-[var(--primary)]"/>
                            </div>
                            <div className="flex gap-3 mt-6">
                                <Button variant="outline" type="button" className="flex-1 justify-center" onClick={() => setEditingExpense(null)}>取消</Button>
                                <Button type="submit" className="flex-1 justify-center">儲存</Button>

                        </form>
                    </div>
                </div>

          );
        };

        const TripDetail = () => {
          const { activeTrip, updateItinerary, updateTrip, setFullScreenImage } = useContext(AppContext);
          const [selectedDay, setSelectedDay] = useState(1);
          const [showAddModal, setShowAddModal] = useState(false);
          const [draggedItem, setDraggedItem] = useState(null);
          const [editingAct, setEditingAct] = useState(null);
          const [previewImage, setPreviewImage] = useState('');
          const fileInputRef = useRef(null);

          if (!activeTrip) return null;
          
          const isSavedPlace = typeof selectedDay === 'string';
          const currentDayData = isSavedPlace 
              ? { day: selectedDay, date: null, weather: null, activities: activeTrip.savedPlaces?.[selectedDay] || [] }
              : (activeTrip.dailyItinerary.find(d => d.day === selectedDay) || activeTrip.dailyItinerary[0]);
          
          if (!currentDayData) return null;

          const handleDragStart = (e, index) => { 
              setDraggedItem(index); 
              e.dataTransfer.effectAllowed = "move"; 
          };
          
          const handleDragOver = (e, index) => { 
              e.preventDefault(); 
              if (draggedItem !== null && draggedItem !== index) { 
                  const newActivities = [...currentDayData.activities]; 
                  const item = newActivities[draggedItem]; 
                  newActivities.splice(draggedItem, 1); 
                  newActivities.splice(index, 0, item); 
                  
                  if (isSavedPlace) {
                      updateTrip(activeTrip.id, { savedPlaces: { ...activeTrip.savedPlaces, [selectedDay]: newActivities } });
                  } else {
                      const newItinerary = activeTrip.dailyItinerary.map(day => day.day === selectedDay ? { ...day, activities: newActivities } : day); 
                      updateItinerary(activeTrip.id, newItinerary); 
                  }
                  setDraggedItem(index); 
              } 
          };
          
          const handleDragEnd = () => setDraggedItem(null);
          
          const moveActivity = (index, direction) => {
              const newActivities = [...currentDayData.activities];
              if (direction === 'up' && index === 0) return;
              if (direction === 'down' && index === newActivities.length - 1) return;
              const swapIndex = direction === 'up' ? index - 1 : index + 1;
              [newActivities[index], newActivities[swapIndex]] = [newActivities[swapIndex], newActivities[index]];
              
              if (isSavedPlace) {
                  updateTrip(activeTrip.id, { savedPlaces: { ...activeTrip.savedPlaces, [selectedDay]: newActivities } });
              } else {
                  const newItinerary = activeTrip.dailyItinerary.map(day => day.day === selectedDay ? { ...day, activities: newActivities } : day); 
                  updateItinerary(activeTrip.id, newItinerary); 
              }
          };

          const handleDeleteActivity = (actId) => { 
              if(!confirm("確定刪除此項目？")) return;
              if (isSavedPlace) {
                  const newActivities = (activeTrip.savedPlaces?.[selectedDay] || []).filter(a => a.id !== actId);
                  updateTrip(activeTrip.id, { savedPlaces: { ...activeTrip.savedPlaces, [selectedDay]: newActivities } });
              } else {
                  const newItinerary = activeTrip.dailyItinerary.map(day => day.day === selectedDay ? { ...day, activities: day.activities.filter(a => a.id !== actId) } : day); 
                  updateItinerary(activeTrip.id, newItinerary); 
              }
          };

          const openAddModal = () => { setEditingAct(null); setPreviewImage(''); setShowAddModal(true); };
          const openEditModal = (act) => { setEditingAct(act); setPreviewImage(act.attachment || ''); setShowAddModal(true); };
          const closeModal = () => { setShowAddModal(false); setEditingAct(null); setPreviewImage(''); };

          const handleImageChange = async (e) => {
            const file = e.target.files[0];
            if (file) {
              try {
                const base64 = await processImageUpload(file);
                setPreviewImage(base64);
              } catch (err) {
                console.error("Image processing failed", err);
                alert("圖片上傳失敗");
              }
            }
          };

          const handleSaveActivity = (e) => { 
              e.preventDefault(); 
              const fd = new FormData(e.target); 
              const newAct = { 
                  id: editingAct ? editingAct.id : crypto.randomUUID(), 
                  time: fd.get('time') || '', 
                  type: fd.get('type'), 
                  location: fd.get('location'), 
                  address: fd.get('address'),
                  link: fd.get('link'),
                  mapLink: fd.get('mapLink'),
                  operatingHours: fd.get('operatingHours'),
                  notes: fd.get('notes'), 
                  cost: parseInt(fd.get('cost') || 0),
                  attachment: previewImage
              }; 

              if (isSavedPlace) {
                  let newActivities = [...(activeTrip.savedPlaces?.[selectedDay] || [])];
                  if (editingAct) {
                      newActivities = newActivities.map(a => a.id === editingAct.id ? newAct : a);
                  } else {
                      newActivities.push(newAct);
                  }
                  updateTrip(activeTrip.id, { savedPlaces: { ...activeTrip.savedPlaces, [selectedDay]: newActivities } });
              } else {
                  const newItinerary = activeTrip.dailyItinerary.map(day => {
                      if (day.day === selectedDay) {
                          let newActivities = [...day.activities];
                          if (editingAct) {
                              newActivities = newActivities.map(a => a.id === editingAct.id ? newAct : a);
                          } else {
                              newActivities.push(newAct);
                          }
                          return { ...day, activities: newActivities.sort((a,b) => a.time.localeCompare(b.time)) };
                      }
                      return day;
                  }); 
                  updateItinerary(activeTrip.id, newItinerary); 
              }
              closeModal(); 
          };

          return (
            <div className="flex flex-col md:flex-row h-full overflow-hidden max-h-screen pb-20 md:pb-0">
              <div className="w-full md:w-64 bg-[#FFFFFF] dark:bg-gray-800 border-r border-gray-100 dark:border-gray-700 overflow-x-auto md:overflow-y-auto p-4 flex md:flex-col gap-3 shrink-0 no-scrollbar">
                 <h3 className="hidden md:block font-bold text-gray-800 dark:text-gray-200 mb-2 px-2">行程天數</h3>
                 {activeTrip.dailyItinerary.map((day) => (
                   <div 
                     key={day.day} 
                     onClick={() => setSelectedDay(day.day)} 
                     className={`cursor-pointer p-4 rounded-2xl border-2 transition-all duration-200 flex-shrink-0 w-32 md:w-full ${
                       selectedDay === day.day 
                         ? 'border-[var(--primary)] bg-[rgba(var(--primary-rgb),0.1)] dark:bg-[rgba(var(--primary-rgb),0.2)] shadow-md transform scale-[1.02]' 
                         : 'bg-white dark:bg-gray-800 border-gray-100 dark:border-gray-700 hover:border-[var(--primary)]/30'
                     }`}
                   >
                     <div className="flex justify-between items-start mb-1">
                       <span className={`font-bold text-lg ${selectedDay === day.day ? 'text-[var(--primary)]' : 'text-gray-800 dark:text-gray-200'}`}>
                         Day {day.day}
                       </span>
                       <WeatherIcon type={day.weather} className="" />
                     </div>
                     <div className={`text-xs ${selectedDay === day.day ? "text-gray-600 dark:text-gray-300 font-medium" : "text-gray-400 dark:text-gray-500"}`}>
                       {formatDateDisplay(day.date)}
                     </div>
                   </div>
                 ))}

                 <h3 className="hidden md:block font-bold text-gray-800 dark:text-gray-200 mt-4 mb-2 px-2 border-t border-gray-100 dark:border-gray-700 pt-4">備案與資訊</h3>
                 {['博多', '天神', '藥院', 'LaLaport', '有用網址'].map(cat => (
                     <div 
                       key={cat} 
                       onClick={() => setSelectedDay(cat)} 
                       className={`cursor-pointer px-4 py-3 rounded-2xl border-2 transition-all duration-200 flex-shrink-0 md:w-full flex items-center gap-2 ${
                         selectedDay === cat 
                           ? 'border-gray-400 dark:border-gray-500 bg-gray-50 dark:bg-gray-700 shadow-sm transform scale-[1.02]' 
                           : 'bg-white dark:bg-gray-800 border-transparent hover:border-gray-200 dark:hover:border-gray-600'
                       }`}
                     >
                         <MapPin size={16} className={selectedDay === cat ? 'text-gray-600 dark:text-gray-300' : 'text-gray-400'}/>
                         <span className={`font-bold text-sm ${selectedDay === cat ? 'text-gray-800 dark:text-gray-200' : 'text-gray-500 dark:text-gray-400'}`}>
                           {cat}
                         </span>
                     </div>
                 ))}
              </div>
              <div className="flex-1 bg-[#F8F9FA] dark:bg-gray-900 overflow-y-auto relative p-6">
                <div className="max-w-2xl mx-auto pb-24 md:pb-10">
                  <header className="mb-6 flex justify-between items-start">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-800 dark:text-white">
                            {isSavedPlace ? `${selectedDay} (備用清單)` : `Day ${selectedDay} 行程`}
                        </h2>
                        {!isSavedPlace && (
                            <div className="flex items-center gap-2 text-gray-500 dark:text-gray-400 mt-1 text-sm mb-2">
                                <Calendar size={14} className="text-[var(--primary)]" /> {formatDateDisplay(currentDayData.date)}
                            </div>
                        )}
                        <MobileDragHint />
                    </div>
                    <Button onClick={() => openAddModal()}><Plus size={16} /> {isSavedPlace ? '新增地點' : '新增活動'}</Button>
                  </header>
                  <div className="relative pl-6 space-y-6">
                    {!isSavedPlace && <div className="absolute left-[29px] top-4 bottom-4 w-0.5 bg-gray-200 dark:bg-gray-700" />}
                    
                    {currentDayData.activities.map((act, index) => {
                      const TypeIcon = ACTIVITY_TYPES[act.type]?.icon || MapPin;
                      const isMapUrl = (url) => url && (url.includes('maps') || url.includes('goo.gl'));
                      const addressTarget = act.mapLink || (isMapUrl(act.link) ? act.link : null);
                      
                      return (
                        <div key={act.id} draggable onDragStart={(e) => handleDragStart(e, index)} onDragOver={(e) => handleDragOver(e, index)} onDragEnd={handleDragEnd} className={`relative flex gap-4 group transition-all duration-300 ${draggedItem === index ? 'opacity-50 scale-95' : 'opacity-100'}`}>
                          {!isSavedPlace && (
                              <div className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 z-10 border-4 border-[#F8F9FA] dark:border-gray-900 ${ACTIVITY_TYPES[act.type]?.bg} ${ACTIVITY_TYPES[act.type]?.color}`}><TypeIcon size={14} /></div>
                          )}
                          <div className="flex-1"><GlassCard className={`p-4 flex gap-3 hover:shadow-md group-hover:border-[var(--primary)] ${isSavedPlace ? 'border-gray-200 dark:border-gray-600' : ''}`}>
                                <div className="flex flex-col items-center text-gray-300 pt-0.5 shrink-0" onMouseDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()}>
                                    <button onClick={(e) => { e.stopPropagation(); moveActivity(index, 'up'); }} disabled={index === 0} className="p-0.5 hover:text-[var(--primary)] md:hidden disabled:opacity-30 disabled:hover:text-gray-300"><ChevronUp size={18}/></button>
                                    <GripVertical size={16} className="hidden md:block cursor-move hover:text-gray-500" />
                                    <button onClick={(e) => { e.stopPropagation(); moveActivity(index, 'down'); }} disabled={index === currentDayData.activities.length - 1} className="p-0.5 hover:text-[var(--primary)] md:hidden disabled:opacity-30 disabled:hover:text-gray-300"><ChevronDown size={18}/></button>
                                </div>
                                <div className="flex-1 min-w-0">
                                    <div className="flex justify-between items-start">
                                        {act.time ? (
                                            <span className="font-mono text-sm font-bold text-[var(--primary)] bg-[rgba(var(--primary-rgb),0.1)] px-2 rounded py-0.5">{act.time}</span>
                                        ) : (
                                            <span className="text-xs font-bold text-gray-500 px-2 py-0.5 border border-gray-200 rounded-full flex items-center gap-1"><TypeIcon size={10}/> {ACTIVITY_TYPES[act.type]?.label || '地點'}</span>
                                        )}
                                        {act.time && <span className="text-xs font-medium text-gray-500 bg-gray-100 dark:bg-gray-700 dark:text-gray-300 px-2 py-0.5 rounded-full">{ACTIVITY_TYPES[act.type]?.label || '地點'}</span>}
                                    </div>
                                    <div className="flex items-center gap-2 mt-2">
                                        <h4 
                                            className={`font-bold text-gray-800 dark:text-gray-100 truncate ${act.link ? 'cursor-pointer hover:text-[var(--primary)] transition-colors' : ''}`}
                                            onClick={(e) => { e.stopPropagation(); act.link && window.open(act.link, '_blank'); }}
                                        >
                                            {act.location}
                                        </h4>
                                        {act.link && <MapPin size={14} className="text-[var(--primary)] shrink-0 cursor-pointer" onClick={(e) => { e.stopPropagation(); window.open(act.link, '_blank'); }} />}
                                    </div>
                                    {act.address && (
                                        <p 
                                            className={`text-xs text-gray-500 dark:text-gray-400 mt-1 flex items-start gap-1 ${addressTarget ? 'cursor-pointer hover:text-[var(--primary)] transition-colors' : ''}`}
                                            onClick={(e) => {
                                                if (addressTarget) {
                                                    e.stopPropagation();
                                                    window.open(addressTarget, '_blank');
                                                }
                                            }}
                                            title={addressTarget ? "在 Google Maps 中開啟" : ""}
                                        >
                                            <MapPin size={12} className="shrink-0 mt-0.5"/> 
                                            <span className={`line-clamp-2 ${addressTarget ? 'underline decoration-dashed underline-offset-2' : ''}`}>{act.address}</span>
                                        </p>
                                    )}
                                    {act.operatingHours && (
                                        <p className="text-xs text-gray-500 dark:text-gray-400 mt-1 flex items-center gap-1">
                                            <Clock size={12} className="shrink-0" />
                                            <span>營業時間: {act.operatingHours}</span>
                                        </p>
                                    )}
                                    {act.notes && <p className="text-sm text-gray-500 dark:text-gray-400 mt-1 whitespace-pre-wrap">{act.notes}</p>}
                                    
                                    {/* Image Attachment displaying with Lightbox Support */}
                                    {act.attachment && (
                                        <div 
                                            className="mt-3 rounded-xl overflow-hidden border border-gray-100 dark:border-gray-700 cursor-zoom-in group/img relative"
                                            onClick={(e) => { e.stopPropagation(); setFullScreenImage(act.attachment); }}
                                        >
                                            <img src={act.attachment} className="w-full h-48 object-cover group-hover/img:scale-105 transition-transform duration-500" alt="attachment" />
                                            <div className="absolute inset-0 bg-black/0 group-hover/img:bg-black/10 transition-colors flex items-center justify-center">
                                                <span className="opacity-0 group-hover/img:opacity-100 bg-black/50 text-white text-xs px-3 py-1.5 rounded-full backdrop-blur-sm transition-opacity duration-300">點擊放大</span>
                                            </div>
                                        </div>
                                    )}

                                    {act.cost > 0 && (
                                        <div className="mt-3 text-xs font-semibold text-gray-400 flex items-center gap-1">
                                            <JapaneseYen size={12} /> ¥{act.cost.toLocaleString()}
                                        </div>
                                    )}
                                </div>
                                <div className="flex flex-col gap-2">
                                    <button onClick={() => openEditModal(act)} className="p-1.5 text-gray-300 hover:text-[var(--primary)] hover:bg-[rgba(var(--primary-rgb),0.1)] rounded-lg transition-colors"><Pencil size={16} /></button>
                                    <button onClick={() => handleDeleteActivity(act.id)} className="p-1.5 text-gray-300 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors"><Trash2 size={16} /></button>
                                </div>
                             </GlassCard></div>
                        </div>
                      );
                    })}
                    {currentDayData.activities.length === 0 && <div className="text-center py-10 text-gray-400 border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-2xl"><div className="inline-block p-4 bg-gray-50 dark:bg-gray-800 rounded-full mb-3"><Calendar size={24} className="text-gray-300" /></div><p>這裡還沒有內容<br/>點擊右上角新增</p></div>}
                  </div>
                </div>
              </div>
              {showAddModal && (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/30 backdrop-blur-sm">
                  <div className="bg-[#FFFFFF] dark:bg-gray-800 rounded-3xl w-full max-w-md p-6 shadow-2xl animate-in fade-in zoom-in duration-200">
                    <h3 className="text-xl font-bold mb-4 dark:text-white">{editingAct ? '編輯內容' : '新增內容'}</h3>
                    <form onSubmit={handleSaveActivity} className="space-y-4">
                      <div className="grid grid-cols-5 gap-2 mb-4">{Object.entries(ACTIVITY_TYPES).map(([key, config]) => (<label key={key} className="cursor-pointer"><input type="radio" name="type" value={key} className="peer hidden" defaultChecked={editingAct ? editingAct.type === key : key === 'Sightseeing'} /><div className={`flex flex-col items-center gap-1 p-2 rounded-lg border border-transparent hover:bg-gray-50 dark:hover:bg-gray-700 peer-checked:bg-gray-100 dark:peer-checked:bg-gray-700 peer-checked:border-gray-200 dark:peer-checked:border-gray-600 peer-checked:${config.color}`}><config.icon size={20} /><span className="text-[10px] font-medium dark:text-gray-300">{config.label}</span></div></label>))}</div>
                      
                      <div className="grid grid-cols-3 gap-3">
                          {!isSavedPlace && (
                              <div>
                                  <label className="block text-xs font-bold text-gray-500 mb-1">時間</label>
                                  <input type="time" name="time" defaultValue={editingAct?.time} required className="w-full border p-2 rounded-xl dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-[var(--primary)]" />
                              </div>
                          )}
                          <div className={isSavedPlace ? "col-span-3" : "col-span-2"}>
                              <label className="block text-xs font-bold text-gray-500 mb-1">地點名稱</label>
                              <input name="location" defaultValue={editingAct?.location} required className="w-full border p-2 rounded-xl dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-[var(--primary)]" />
                          </div>
                      </div>
                      
                      <div>
                          <label className="block text-xs font-bold text-gray-500 mb-1">地址 (選填)</label>
                          <input name="address" defaultValue={editingAct?.address} placeholder="例如: 福岡縣福岡市博多區..." className="w-full border p-2 rounded-xl dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-[var(--primary)]" />
                      </div>
                      
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                          <div>
                              <label className="block text-xs font-bold text-gray-500 mb-1">網站連結 (選填)</label>
                              <input type="url" name="link" defaultValue={editingAct?.link} placeholder="https://..." className="w-full border p-2 rounded-xl dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-[var(--primary)]" />
                          </div>
                          <div>
                              <label className="block text-xs font-bold text-gray-500 mb-1">地圖連結 (選填)</label>
                              <input type="url" name="mapLink" defaultValue={editingAct?.mapLink} placeholder="https://maps..." className="w-full border p-2 rounded-xl dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-[var(--primary)]" />
                          </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                          <div>
                              <label className="block text-xs font-bold text-gray-500 mb-1">營業時間 (選填)</label>
                              <input name="operatingHours" defaultValue={editingAct?.operatingHours} placeholder="例如: 10:00–20:00" className="w-full border p-2 rounded-xl dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-[var(--primary)]" />
                          </div>
                          <div>
                              <label className="block text-xs font-bold text-gray-500 mb-1">預計花費 (JPY)</label>
                              <input type="number" name="cost" defaultValue={editingAct?.cost} placeholder="0" className="w-full border p-2 rounded-xl dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none focus:ring-2 focus:ring-[var(--primary)]" />
                          </div>
                      </div>
                      
                      <div>
                          <label className="block text-xs font-bold text-gray-500 mb-1">備註</label>
                          <textarea name="notes" defaultValue={editingAct?.notes} rows="2" className="w-full border p-2 rounded-xl dark:bg-gray-700 dark:border-gray-600 dark:text-white resize-none outline-none focus:ring-2 focus:ring-[var(--primary)]" />
                      </div>

                      <div>
                          <label className="block text-xs font-bold text-gray-500 mb-1">附件 (圖片/導覽圖)</label>
                          <div 
                              className="relative w-full h-24 rounded-xl overflow-hidden bg-gray-50 dark:bg-gray-700 border-2 border-dashed border-gray-200 dark:border-gray-600 hover:border-[var(--primary)] cursor-pointer transition-colors flex flex-col items-center justify-center text-gray-400 hover:text-[var(--primary)]"
                              onClick={() => fileInputRef.current?.click()}
                          >
                              {previewImage ? (
                                  <>
                                      <img src={previewImage} className="w-full h-full object-cover" alt="preview" />
                                      <div className="absolute inset-0 bg-black/30 flex items-center justify-center text-white opacity-0 hover:opacity-100 transition-opacity"><Upload size={20}/></div>
                                  </>
                              ) : (
                                  <>
                                      <ImageIcon size={20} className="mb-1"/>
                                      <span className="text-xs">點擊上傳附件照片</span>
                                  </>
                              )}
                              <input type="file" ref={fileInputRef} onChange={handleImageChange} accept="image/*" className="hidden" />
                          </div>
                      </div>

                      <div className="flex gap-3 pt-4">
                          <Button variant="outline" type="button" className="flex-1 justify-center" onClick={closeModal}>取消</Button>
                          <Button type="submit" className="flex-1 justify-center">儲存</Button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        };

        // --- Main Layout ---
        const MainLayout = () => {
          const { currentView, activeTrip, setActiveTripId, setCurrentView, updateTrip } = useContext(AppContext);
          const [editingTrip, setEditingTrip] = useState(null);

          const handleDashboardClick = () => { setCurrentView('dashboard'); setActiveTripId(null); };

          const handleEditSave = (updatedData) => {
            if (editingTrip) {
              updateTrip(editingTrip.id, updatedData);
              setEditingTrip(null);
            }
          };

          const renderView = () => {
            switch(currentView) {
              case 'dashboard': return <Dashboard />;
              case 'trip-detail': return <TripDetail />;
              case 'food': return <FoodList />;
              case 'budget': return <BudgetPage />;
              case 'preparation': return <Preparation />; 
              case 'reservations': return <Reservations />;
              case 'shopping': return <ShoppingList />;
              case 'settings': return <SettingsPage />;
              default: return <Dashboard />;
            }
          };

          return (
            <div className={`min-h-screen flex flex-col`}>
              <Header />
              <div className="flex flex-col flex-1 relative">
                {activeTrip && currentView !== 'dashboard' && (
                  <div className="md:hidden h-14 bg-[#FFFFFF]/80 dark:bg-gray-900/80 backdrop-blur border-b border-gray-100 dark:border-gray-800 flex items-center px-4 justify-between sticky top-16 z-30">
                     <div className="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400 truncate">
                       <Home size={14} /> / <span className="font-medium text-gray-800 dark:text-gray-200 truncate">{activeTrip.title}</span>
                     </div>
                     <button onClick={handleDashboardClick} className="flex items-center gap-1 px-2 py-1 rounded-2xl text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800"><X size={16} /></button>
                  </div>
                )}
                
                {activeTrip && currentView !== 'dashboard' && (
                  <div className="hidden md:flex h-16 items-center px-10 border-b border-gray-100 dark:border-gray-800 bg-[#FFFFFF]/80 dark:bg-gray-900/80 backdrop-blur sticky top-16 z-40 justify-between">
                    <div className="flex items-center gap-4">
                      <div className="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400"><Home size={14} /> / <span className="font-medium text-gray-800 dark:text-gray-200">{activeTrip.title}</span>
                        <button onClick={() => setEditingTrip(activeTrip)} className="p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full text-gray-400 hover:text-[var(--primary)]" title="編輯旅程"><Pencil size={12} /></button>
                      </div>
                      <div className="text-xs font-mono text-gray-400 border-l border-gray-200 dark:border-gray-700 pl-3">
                        {activeTrip.startDate} - {activeTrip.endDate} {calculateDuration(activeTrip.startDate, activeTrip.endDate)}
                      </div>
                    </div>
                    <button onClick={handleDashboardClick} className="flex items-center gap-2 px-3 py-1.5 rounded-2xl text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-700 dark:hover:text-gray-200 transition-colors text-sm font-medium"><X size={16} /> 返回總覽</button>
                  </div>
                )}
                
                {editingTrip && <EditTripModal trip={editingTrip} onClose={() => setEditingTrip(null)} onSave={handleEditSave} />}

                <main className="flex-1 relative">
                   {renderView()}
                </main>

                {activeTrip && currentView !== 'dashboard' && <BottomNav />}
                
                {/* Global Image Lightbox Component */}
                <ImageLightbox />
              </div>
            </div>
          );
        };

        // Render the App
        const rootElement = document.getElementById('root');
        const root = createRoot(rootElement);
        root.render(
          <AppProvider>
            <MainLayout />
          </AppProvider>
        );
    </script>
</body>
</html>
