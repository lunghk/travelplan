        // Helper: Image Processing
        const processImageUpload = (file) => {
          return new Promise((resolve, reject) => {
            if (!file) return reject("No file provided");
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
              const img = new Image();
              img.src = event.target.result;
              img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const MAX_SIZE = 1200; 
                let width = img.width;
                let height = img.height;
                if (width > height) {
                  if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                } else {
                  if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                }
                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.8));
              };
            };
            reader.onerror = error => reject(error);
          });
        };

        // Helper: Safe UTC Date Parsing
        const parseDateUTC = (dateStr) => {
          if (!dateStr) return new Date();
          const [y, m, d] = dateStr.split('-').map(Number);
          return new Date(Date.UTC(y, m - 1, d));
        };

        // Helper: Calculate Duration
        const calculateDuration = (start, end) => {
          if (!start || !end) return "";
          const startDate = parseDateUTC(start);
          const endDate = parseDateUTC(end);
          const diffTime = Math.abs(endDate - startDate);
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
          return `(${diffDays + 1}天${diffDays}夜)`;
        };

              try {
                const parsed = JSON.parse(saved);
                if (!parsed.appName) parsed.appName = "Chai Chu 旅行記錄";
                if (!parsed.themeColor) parsed.themeColor = "#FFB7C5";
                if (!parsed.settings) parsed.settings = { fontSize: 16, darkMode: false };
                if (typeof parsed.settings.fontSize === 'string') {
                     if (parsed.settings.fontSize === 'small') parsed.settings.fontSize = 14;
                     else if (parsed.settings.fontSize === 'large') parsed.settings.fontSize = 18;
                     else parsed.settings.fontSize = 16;
                }
                setData(parsed);
              } catch (e) {
                console.error("Failed to parse data", e);
              }
            }
          }, []);

          useEffect(() => {
            localStorage.setItem('qi_pig_travel_data', JSON.stringify(data));
            const root = document.documentElement;
            root.style.setProperty('--primary', data.themeColor);
            root.style.setProperty('--primary-rgb', hexToRgb(data.themeColor));
            
            if (data.settings?.darkMode) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');

            document.documentElement.style.fontSize = `${fontSize}px`;

            setData(prev => ({ ...prev, trips: prev.trips.filter(t => t.id !== id) }));

          const updateAppName = (newName) => setData(prev => ({ ...prev, appName: newName }));

          const updateTrip = (tripId, updatedFields) => {
            setData(prev => {
              return {
                ...prev,
                trips: prev.trips.map(t => {
                  if (t.id !== tripId) return t;
                  
                  if (updatedFields.startDate && updatedFields.endDate) {
                    const start = parseDateUTC(updatedFields.startDate);
                    const end = parseDateUTC(updatedFields.endDate);
                    const diffTime = Math.abs(end - start);
                    const newDaysCount = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
                    
                    const newItinerary = Array.from({ length: newDaysCount }, (_, i) => {
                      const currentDayDate = new Date(start);
                      currentDayDate.setUTCDate(start.getUTCDate() + i);
                      const currentItineraryDate = currentDayDate.toISOString().split('T')[0];
                      
                      const existingDay = t.dailyItinerary[i];
                      if (existingDay) return { ...existingDay, day: i + 1, date: currentItineraryDate };
                      return {
                        day: i + 1,
                        date: currentItineraryDate,
                        weather: ['sun', 'cloud-sun', 'cloud'][Math.floor(Math.random() * 3)],
                        temp: '15°C / 22°C',
                        activities: []
                      };
                    });
                    return { ...t, ...updatedFields, dailyItinerary: newItinerary };
                  }
                  return { ...t, ...updatedFields };
                })
              };
            });
          };

                </div>

                <div className="p-6 pl-10 relative text-white" style={{ background: `var(--primary)`, filter: 'brightness(0.9) saturate(1.1)' }}>
                    <div className="flex justify-between items-start mb-6">
                        <div className="flex flex-col">
                            <span className="text-xs font-bold tracking-widest opacity-80 mb-1">BOARDING PASS</span>
                            {isParsed ? (
                                <span className="text-lg font-bold">{getCityName(info.origin)} <span className="mx-1">→</span> {getCityName(info.dest)}</span>
                            ) : (
                                <span className="text-lg font-bold">{res.title}</span>
                            )}
                        </div>
                        <MoreVertical size={20} className="opacity-60" />
                    </div>

                    <div className="flex justify-between items-center mb-2">
                        <div className="text-center">
                            <div className="text-4xl font-black mb-1">{info.origin}</div>
                            <div className="text-xs opacity-80 mb-1">出發</div>
                            <div className="text-xl font-bold">{info.depTime}</div>
                        </div>

                        <div className="flex flex-col items-center flex-1 px-4">
                            <Plane size={24} className="transform rotate-90 mb-2 opacity-90" />
                            <div className="w-full h-0.5 bg-white/30 relative">
                                <div className="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 w-2 h-2 bg-white rounded-full"></div>
                            </div>
                        </div>

                        <div className="text-center">
                            <div className="text-4xl font-black mb-1">{info.dest}</div>
                            <div className="text-xs opacity-80 mb-1">抵達</div>
                            <div className="text-xl font-bold">{info.arrTime}</div>
                        </div>
                    </div>
                    
                    <div className="absolute -bottom-10 -right-10 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
                    <div className="absolute top-10 left-1/3 w-10 h-10 bg-white/20 rounded-full blur-xl"></div>
                </div>

                <div className="bg-white dark:bg-gray-800 p-4 relative">
                    <div className="absolute -top-2 left-0 right-0 h-4 flex justify-between px-1">
                         {Array.from({length: 20}).map((_, i) => <div key={i} className="w-3 h-3 bg-[#F8F9FA] dark:bg-gray-950 rounded-full -mt-2"></div>)}
                    </div>

                    <div className="flex justify-between items-center pt-2 pl-6">
                        <div>
                            <div className="text-xs text-gray-400 mb-0.5">航班編號</div>
                            <div className="font-bold text-gray-700 dark:text-gray-200">{info.flight}</div>
                        </div>
                        <div className="text-right flex items-center gap-3">
                            <div>
                                <div className="text-xs text-gray-400 mb-0.5">日期</div>
                                <div className="font-bold text-gray-700 dark:text-gray-200">{res.date || "未設定"}</div>
                            </div>
                            {res.attachment && (
                                <button 
                                    className="p-2 bg-gray-100 hover:bg-[rgba(var(--primary-rgb),0.1)] dark:bg-gray-700 rounded-lg text-[var(--primary)] transition-colors"
                                    onClick={(e) => { e.stopPropagation(); setFullScreenImage(res.attachment); }}
                                    title="查看機票憑證"
                                >
                                    <Paperclip size={16}/>
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            </div>
          );
        };

        const Reservations = () => {
          const { activeTrip, updateTripArray, setFullScreenImage } = useContext(AppContext);
          const [showModal, setShowModal] = useState(false);
          const [editingItem, setEditingItem] = useState(null);
          const [modalType, setModalType] = useState('flight'); 
          const [draggedItem, setDraggedItem] = useState(null);
          const [previewImage, setPreviewImage] = useState('');
          const [copiedId, setCopiedId] = useState(null);
          const fileInputRef = useRef(null);

          const flightRef = useRef(null);
          const hotelRef = useRef(null);
          const carRef = useRef(null);
          const ticketRef = useRef(null);

          const reservations = activeTrip.reservations || [];
          const flights = reservations.filter(r => r.type === 'flight');
          const hotels = reservations.filter(r => r.type === 'hotel');
          const cars = reservations.filter(r => r.type === 'car');
          const tickets = reservations.filter(r => r.type === 'ticket');

          const scrollTo = (ref) => ref.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });

          const handleImageChange = async (e) => {
            const file = e.target.files[0];
            if (file) {
              try {
                const base64 = await processImageUpload(file);
                setPreviewImage(base64);
              } catch (err) {
                console.error("Image processing failed", err);
                alert("圖片上傳失敗");
              }
            }
          };

          const handleSaveRes = (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const item = {
                id: editingItem ? editingItem.id : crypto.randomUUID(),
                type: modalType,
                title: fd.get('title'),
                detail: fd.get('detail'),
                date: fd.get('date'),
                link: fd.get('link'),
                address: fd.get('address'),
                attachment: previewImage,
                confirmed: true
            };
            const newReservations = editingItem 
              ? reservations.map(r => r.id === editingItem.id ? item : r) 
              : [...reservations, item];
            updateTripArray(activeTrip.id, 'reservations', newReservations);
            closeModal();
          };

          const handleCopy = (e, id, text) => {
              e.stopPropagation();
              const textArea = document.createElement("textarea");
              textArea.value = text;
              document.body.appendChild(textArea);
              textArea.select();
              try {
                  document.execCommand('copy');
                  setCopiedId(id);
                  setTimeout(() => setCopiedId(null), 2000);
              } catch (err) {
                  console.error('複製失敗', err);
              }
              document.body.removeChild(textArea);
          };

          const deleteRes = (id) => {
              if(confirm("確定刪除此預約？")) {
                  updateTripArray(activeTrip.id, 'reservations', reservations.filter(r => r.id !== id));
              }
          };

          const handleDragStart = (e, index, type) => {
              setDraggedItem({ index, type });
              e.dataTransfer.effectAllowed = "move";
          };

          const handleDragOver = (e, index, type) => {
              e.preventDefault();
              if (!draggedItem || draggedItem.index === index || draggedItem.type !== type) return;
              
              const currentTypeItems = reservations.filter(r => r.type === type);
              const otherItems = reservations.filter(r => r.type !== type);

              const newTypeItems = [...currentTypeItems];
              const item = newTypeItems[draggedItem.index];
              newTypeItems.splice(draggedItem.index, 1);
              newTypeItems.splice(index, 0, item);
              
              updateTripArray(activeTrip.id, 'reservations', [...otherItems, ...newTypeItems]);
              setDraggedItem({ ...draggedItem, index });
          };

          const handleDragEnd = () => {
              setDraggedItem(null);
          };

          const moveRes = (index, type, direction) => {
              const currentTypeItems = reservations.filter(r => r.type === type);
              if (direction === 'up' && index === 0) return;
              if (direction === 'down' && index === currentTypeItems.length - 1) return;
              
              const otherItems = reservations.filter(r => r.type !== type);
              const newTypeItems = [...currentTypeItems];
              const swapIndex = direction === 'up' ? index - 1 : index + 1;
              [newTypeItems[index], newTypeItems[swapIndex]] = [newTypeItems[swapIndex], newTypeItems[index]];
              
              updateTripArray(activeTrip.id, 'reservations', [...otherItems, ...newTypeItems]);
          };

          const openAddModal = (type) => { 
            setEditingItem(null); 
            setModalType(type); 
            setPreviewImage('');
            setShowModal(true); 
          };
          
          const openEditModal = (item) => { 
            setEditingItem(item); 
            setModalType(item.type); 
            setPreviewImage(item.attachment || '');
            setShowModal(true); 
          };
          
          const closeModal = () => { 
            setShowModal(false); 
            setEditingItem(null); 
            setPreviewImage('');
          };

          const renderGenericCard = (res, index, type, Icon, colorClass, bgClass, arrLength) => (
            <div 
              key={res.id}
              draggable
              onDragStart={(e) => handleDragStart(e, index, type)}
              onDragOver={(e) => handleDragOver(e, index, type)}
              onDragEnd={handleDragEnd}
              className={`transition-all duration-300 ${draggedItem?.index === index && draggedItem?.type === type ? 'opacity-50 scale-95' : ''}`}
            >
              <GlassCard className="p-0 flex flex-row overflow-hidden group cursor-pointer border-none shadow-md hover:shadow-xl transition-all" onClick={() => res.link ? window.open(res.link, '_blank') : openEditModal(res)}>
                  <div className="w-8 flex flex-col items-center justify-center bg-gray-100 dark:bg-gray-800 text-gray-400 shrink-0" onMouseDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()}>
                      <button onClick={() => moveRes(index, type, 'up')} disabled={index === 0} className="p-1 hover:text-[var(--primary)] md:hidden disabled:opacity-30 disabled:hover:text-gray-400"><ChevronUp size={18}/></button>
                      <GripVertical size={16} className="hidden md:block cursor-move hover:text-gray-600 hover:bg-gray-200 w-full py-2 h-full" />
                      <button onClick={() => moveRes(index, type, 'down')} disabled={index === arrLength - 1} className="p-1 hover:text-[var(--primary)] md:hidden disabled:opacity-30 disabled:hover:text-gray-400"><ChevronDown size={18}/></button>
                  </div>
                  <div 
                    className={`w-24 relative flex items-center justify-center ${bgClass} ${res.attachment ? 'cursor-zoom-in group/img' : ''}`}
                    onClick={(e) => { 
                        if (res.attachment) { 
                            e.stopPropagation(); 
                            setFullScreenImage(res.attachment); 
                        } 
                    }}
                  >
                     {res.attachment ? (
                         <>
                            <img src={res.attachment} className="w-full h-full object-cover" alt="attachment" />
                            <div className="absolute inset-0 bg-black/0 group-hover/img:bg-black/20 transition-colors flex items-center justify-center">
                                <span className="opacity-0 group-hover/img:opacity-100 text-white bg-black/50 px-2 py-1 rounded-lg text-[10px]">放大</span>
                            </div>
                         </>
                     ) : (
                         <Icon size={32} className={colorClass} />
                     )}
                  </div>
                  <div className="p-4 flex-1 flex flex-col justify-center min-w-0">
                      <div className="flex items-center gap-2">
                          <h4 className="font-bold text-gray-800 dark:text-gray-100 text-lg truncate">{res.title}</h4>
                          {res.link && <MapPin size={14} className="text-[var(--primary)] shrink-0" />}
                      </div>
                      <p className="text-sm text-gray-500 dark:text-gray-400 mt-1 flex items-center gap-1 truncate"><Calendar size={12} className="shrink-0"/> <span className="truncate">{res.detail}</span></p>
                      {res.address && (
                          <div className="mt-2 flex items-center gap-1 text-xs text-gray-500 dark:text-gray-400 bg-gray-50 dark:bg-gray-900/50 p-1.5 rounded-lg border border-gray-100 dark:border-gray-700">
                              <MapPin size={12} className="shrink-0 text-gray-400" />
                              <span 
                                  className={`truncate flex-1 font-medium ${res.link ? 'cursor-pointer hover:text-[var(--primary)] underline decoration-dashed underline-offset-2 transition-colors' : ''}`}
                                  onClick={(e) => {
                                      if (res.link) {
                                          e.stopPropagation();
                                          window.open(res.link, '_blank');
                                      }
                                  }}
                                  title={res.link ? "在 Google Maps 中開啟" : ""}
                              >
                                  {res.address}
                              </span>
                              <button 
                                  onClick={(e) => handleCopy(e, res.id, res.address)}
                                  className="ml-1 px-2 py-1 bg-white hover:bg-gray-100 dark:bg-gray-800 dark:hover:bg-gray-700 rounded-md shadow-sm border border-gray-200 dark:border-gray-600 text-gray-600 dark:text-gray-300 transition-colors flex items-center gap-1 shrink-0"
                                  title="複製地址"
                              >
                                  {copiedId === res.id ? (
                                      <><Check size={12} className="text-green-500" /><span className="text-green-500">已複製</span></>
                                  ) : (
                                      <><Copy size={12} /><span>複製</span></>
                                  )}
                              </button>
                          </div>
                      )}
                  </div>
                  <div className="flex flex-col sm:flex-row items-center justify-center px-2 sm:px-4 border-l border-gray-100 dark:border-gray-700 gap-1 sm:gap-2 shrink-0">
                      <button onClick={(e) => {e.stopPropagation(); openEditModal(res)}} className="p-2 text-gray-300 hover:text-[var(--primary)] hover:bg-[rgba(var(--primary-rgb),0.1)] rounded-full transition-all"><Pencil size={16}/></button>
                      <button onClick={(e) => {e.stopPropagation(); deleteRes(res.id)}} className="p-2 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-full transition-all"><Trash2 size={16}/></button>
                  </div>
              </GlassCard>
            </div>
          );

          return (
            <div className="p-6 md:p-10 max-w-4xl mx-auto space-y-8 pb-32 bg-[#FAF8F5] dark:bg-gray-950 min-h-screen">
              <div className="flex justify-between items-start mb-6">
                <div>
                    <h2 className="text-3xl font-black text-gray-800 dark:text-white tracking-tight">預約管理</h2>
                    <p className="text-gray-500 text-sm mt-1 font-medium">機票、住宿、租車與票券</p>
                </div>
                <div className="flex items-center gap-2">
                     <Button onClick={() => openAddModal('flight')} className="rounded-full px-4 bg-[var(--primary)] hover:brightness-90 shadow-[var(--primary)]/30 text-white font-bold border-none">
                        <Plus size={18} /> <span className="ml-1">新增</span>
                     </Button>
                </div>
              </div>

              <MobileDragHint />

              <div className="flex gap-3 mb-8 overflow-x-auto no-scrollbar pb-2">
                  <button onClick={() => scrollTo(flightRef)} className="flex items-center gap-2 px-4 py-2 rounded-full bg-[rgba(var(--primary-rgb),0.1)] text-[var(--primary)] font-bold text-sm shadow-sm border border-[rgba(var(--primary-rgb),0.2)] whitespace-nowrap">
                     <Plane size={14} className="fill-current"/> 機票 <span className="bg-white text-[var(--primary)] px-1.5 py-0.5 rounded-full text-xs ml-1">{flights.length}</span>
                  </button>
                  <button onClick={() => scrollTo(hotelRef)} className="flex items-center gap-2 px-4 py-2 rounded-full bg-white text-gray-500 font-medium text-sm border border-gray-200 hover:bg-gray-50 transition-colors whitespace-nowrap">
                     <Hotel size={14}/> 住宿 <span className="bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded-full text-xs ml-1">{hotels.length}</span>
                  </button>
                  <button onClick={() => scrollTo(carRef)} className="flex items-center gap-2 px-4 py-2 rounded-full bg-white text-gray-500 font-medium text-sm border border-gray-200 hover:bg-gray-50 transition-colors whitespace-nowrap">
                     <Car size={14}/> 租車 <span className="bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded-full text-xs ml-1">{cars.length}</span>
                  </button>
                  <button onClick={() => scrollTo(ticketRef)} className="flex items-center gap-2 px-4 py-2 rounded-full bg-white text-gray-500 font-medium text-sm border border-gray-200 hover:bg-gray-50 transition-colors whitespace-nowrap">
                     <Ticket size={14}/> 票券 <span className="bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded-full text-xs ml-1">{tickets.length}</span>
                  </button>
              </div>

              <section ref={flightRef} className="scroll-mt-28 mb-12">
                  <div className="grid gap-6">
                      {flights.map((res, index) => (
                          <BoardingPass 
                            key={res.id} 
                            res={res} 
                            onDelete={deleteRes} 
                            onEdit={openEditModal} 
                            setFullScreenImage={setFullScreenImage}
                            onMoveUp={() => moveRes(index, 'flight', 'up')}
                            onMoveDown={() => moveRes(index, 'flight', 'down')}
                            isFirst={index === 0}
                            isLast={index === flights.length - 1}
                            draggable
                            onDragStart={(e) => handleDragStart(e, index, 'flight')}
                            onDragOver={(e) => handleDragOver(e, index, 'flight')}
                            onDragEnd={handleDragEnd}
                          />
                      ))}
                      {flights.length === 0 && <div className="text-center text-gray-400 py-10 border-2 border-dashed border-[rgba(var(--primary-rgb),0.2)] rounded-3xl bg-[rgba(var(--primary-rgb),0.05)]">尚無機票資訊</div>}
                  </div>
              </section>

              <section ref={hotelRef} className="scroll-mt-28 mb-12">
                  <div className="flex items-center gap-2 mb-4">
                      <div className="p-2 bg-[rgba(var(--primary-rgb),0.1)] rounded-lg text-[var(--primary)]"><Hotel size={20}/></div>
                      <h3 className="text-xl font-bold text-gray-700 dark:text-gray-200">住宿</h3>
                  </div>
                  <div className="grid gap-4">
                      {hotels.map((res, index) => renderGenericCard(res, index, 'hotel', Hotel, 'text-purple-500', 'bg-purple-100 dark:bg-purple-900/20', hotels.length))}
                      {hotels.length === 0 && <div className="text-center text-gray-400 py-6 border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-xl text-sm">尚無住宿資訊</div>}
                  </div>
              </section>

              <section ref={carRef} className="scroll-mt-28 mb-12">
                  <div className="flex items-center gap-2 mb-4">
                      <div className="p-2 bg-[rgba(var(--primary-rgb),0.1)] rounded-lg text-[var(--primary)]"><Car size={20}/></div>
                      <h3 className="text-xl font-bold text-gray-700 dark:text-gray-200">租車</h3>
                  </div>
                  <div className="grid gap-4">
                      {cars.map((res, index) => renderGenericCard(res, index, 'car', Car, 'text-emerald-500', 'bg-emerald-100 dark:bg-emerald-900/20', cars.length))}
                      {cars.length === 0 && <div className="text-center text-gray-400 py-6 border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-xl text-sm">尚無租車資訊</div>}
                  </div>
              </section>

              <section ref={ticketRef} className="scroll-mt-28">
                  <div className="flex items-center gap-2 mb-4">
                      <div className="p-2 bg-[rgba(var(--primary-rgb),0.1)] rounded-lg text-[var(--primary)]"><Ticket size={20}/></div>
                      <h3 className="text-xl font-bold text-gray-700 dark:text-gray-200">票券</h3>
                  </div>
                  <div className="grid gap-4">
                      {tickets.map((res, index) => renderGenericCard(res, index, 'ticket', Ticket, 'text-blue-500', 'bg-blue-100 dark:bg-blue-900/20', tickets.length))}
                      {tickets.length === 0 && <div className="text-center text-gray-400 py-6 border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-xl text-sm">尚無票券資訊</div>}
                  </div>
              </section>

              {showModal && (
                  <div className="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-[80] p-4" onClick={closeModal}>
                      <div className="bg-white dark:bg-gray-800 rounded-3xl p-6 w-full max-w-sm shadow-2xl animate-in fade-in zoom-in duration-200" onClick={e => e.stopPropagation()}>
                          <div className="flex justify-between items-center mb-4">
                              <h3 className="text-lg font-bold dark:text-white">{editingItem ? '編輯預約' : '新增預約'}</h3>
                              <button onClick={closeModal} className="text-gray-400 hover:text-gray-600"><X size={20}/></button>
                          </div>
                          <form onSubmit={handleSaveRes} className="space-y-4">
                              <div className="grid grid-cols-4 gap-2 mb-2">
                                  <button type="button" onClick={() => setModalType('flight')} className={`py-2 rounded-lg text-xs font-bold transition-colors ${modalType === 'flight' ? 'bg-[var(--primary)] text-white shadow-md' : 'bg-gray-100 text-gray-500'}`}>機票</button>
                                  <button type="button" onClick={() => setModalType('hotel')} className={`py-2 rounded-lg text-xs font-bold transition-colors ${modalType === 'hotel' ? 'bg-purple-500 text-white shadow-md' : 'bg-gray-100 text-gray-500'}`}>住宿</button>
                                  <button type="button" onClick={() => setModalType('car')} className={`py-2 rounded-lg text-xs font-bold transition-colors ${modalType === 'car' ? 'bg-emerald-500 text-white shadow-md' : 'bg-gray-100 text-gray-500'}`}>租車</button>
                                  <button type="button" onClick={() => setModalType('ticket')} className={`py-2 rounded-lg text-xs font-bold transition-colors ${modalType === 'ticket' ? 'bg-blue-500 text-white shadow-md' : 'bg-gray-100 text-gray-500'}`}>票券</button>
                              </div>
                              <div>
                                  <label className="block text-xs font-bold text-gray-500 mb-1">標題</label>
                                  <input name="title" defaultValue={editingItem?.title} placeholder={modalType === 'flight' ? "例如: 去程機票" : modalType === 'car' ? "例如: Toyota Rent-A-Car" : "例如: 預約項目名稱"} required className="w-full border dark:border-gray-700 dark:bg-gray-700 dark:text-white rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-[var(--primary)]"/>
                              </div>
                              <div>
                                  <label className="block text-xs font-bold text-gray-500 mb-1">
                                    詳情 
                                    {modalType === 'flight' && <span className="text-[10px] text-[var(--primary)] ml-1">(格式: 航班 時間 機場 &rarr; 時間 機場)</span>}
                                    {modalType === 'car' && <span className="text-[10px] text-gray-400 ml-1">(取還車地點、車型)</span>}
                                  </label>
                                  <textarea name="detail" defaultValue={editingItem?.detail} rows="2" placeholder="填寫詳細資訊..." required className="w-full border dark:border-gray-700 dark:bg-gray-700 dark:text-white rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-[var(--primary)] resize-none"></textarea>
                              </div>
                              <div className="grid grid-cols-2 gap-3">
                                  <div>
                                      <label className="block text-xs font-bold text-gray-500 mb-1">日期</label>
                                  <input type="date" name="date" defaultValue={editingItem?.date} className="w-full border dark:border-gray-700 dark:bg-gray-700 dark:text-white rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-[var(--primary)]"/>
                              </div>
                              <div>
                                  <label className="block text-xs font-bold text-gray-500 mb-1">地圖連結 (選填)</label>
                                  <input type="url" name="link" defaultValue={editingItem?.link} placeholder="https://..." className="w-full border dark:border-gray-700 dark:bg-gray-700 dark:text-white rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-[var(--primary)]"/>
                              </div>
                          </div>
                          
                          {modalType !== 'flight' && (
                              <div>
                                  <label className="block text-xs font-bold text-gray-500 mb-1">地址 (選填)</label>
                                  <input name="address" defaultValue={editingItem?.address} placeholder="例如: 福岡縣福岡市博多區..." className="w-full border dark:border-gray-700 dark:bg-gray-700 dark:text-white rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-[var(--primary)]"/>
                              </div>
                          )}
                          
                          <div>
                              <label className="block text-xs font-bold text-gray-500 mb-1">附件 (圖片/憑證)</label>
                                  <div 
                                      className="relative w-full h-32 rounded-2xl overflow-hidden bg-gray-50 dark:bg-gray-700 border-2 border-dashed border-gray-200 dark:border-gray-600 hover:border-[var(--primary)] cursor-pointer transition-colors flex flex-col items-center justify-center text-gray-400 hover:text-[var(--primary)]"
                                      onClick={() => fileInputRef.current?.click()}
                                  >
                                      {previewImage ? (
                                          <>
                                              <img src={previewImage} className="w-full h-full object-cover" alt="preview" />
                                              <div className="absolute inset-0 bg-black/30 flex items-center justify-center text-white opacity-0 hover:opacity-100 transition-opacity"><Upload size={20}/></div>
                                          </>
                                      ) : (
                                          <>
                                              <ImageIcon size={24} className="mb-2"/>
                                              <span className="text-xs">點擊上傳憑證照片</span>
                                          </>
                                      )}
                                      <input type="file" ref={fileInputRef} onChange={handleImageChange} accept="image/*" className="hidden" />
                                  </div>
                              </div>

                              <div className="flex gap-3 mt-6">
                                  <Button variant="outline" type="button" className="flex-1 justify-center" onClick={closeModal}>取消</Button>
                                  <Button type="submit" className="flex-1 justify-center bg-[var(--primary)] hover:brightness-90 text-white shadow-none">儲存</Button>
                              </div>
                          </form>
                      </div>
                  </div>
              )}
            </div>
          );
        };

        const ShoppingList = () => {
            const { activeTrip, updateTripArray, setFullScreenImage } = useContext(AppContext);
            const [newItem, setNewItem] = useState('');
            const [draggedItem, setDraggedItem] = useState(null);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [previewImage, setPreviewImage] = useState('');
            const fileInputRef = useRef(null);
            
            const list = activeTrip.shoppingList || [];

            const handleOpenModal = (item = null) => {
                setEditingItem(item);
                setPreviewImage(item?.image || '');
                setIsModalOpen(true);
            };

            const handleCloseModal = () => {
                setIsModalOpen(false);
                setEditingItem(null);
                setPreviewImage('');
            };

            const handleSaveItem = (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const itemData = {
                    id: editingItem ? editingItem.id : crypto.randomUUID(),
                    item: fd.get('item'),
                    image: previewImage,
                    notes: fd.get('notes'),
                    completed: editingItem ? editingItem.completed : false
                };

                if (editingItem) {
                    updateTripArray(activeTrip.id, 'shoppingList', list.map(i => i.id === editingItem.id ? itemData : i));
                } else {
                    updateTripArray(activeTrip.id, 'shoppingList', [...list, itemData]);
                }
                handleCloseModal();
            };

            const handleImageChange = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    try {
                        const base64 = await processImageUpload(file);
                        setPreviewImage(base64);
                    } catch (err) {
                        console.error("Image processing failed", err);
                        alert("圖片上傳失敗");
                    }
                }
            };

            const addItem = (e) => { e.preventDefault(); if(!newItem.trim()) return; updateTripArray(activeTrip.id, 'shoppingList', [...list, { id: crypto.randomUUID(), item: newItem, completed: false }]); setNewItem(''); };
            const toggleItem = (id) => { updateTripArray(activeTrip.id, 'shoppingList', list.map(i => i.id === id ? { ...i, completed: !i.completed } : i)); };
            const deleteItem = (id) => { updateTripArray(activeTrip.id, 'shoppingList', list.filter(i => i.id !== id)); };

            const handleDragStart = (e, index) => {
                setDraggedItem(index);
                e.dataTransfer.effectAllowed = "move";
            };

            const handleDragOver = (e, index) => {
                e.preventDefault();
                if (draggedItem === null || draggedItem === index) return;
                
                const newList = [...list];
                const item = newList[draggedItem];
                newList.splice(draggedItem, 1);
                newList.splice(index, 0, item);
                
                setDraggedItem(index);
                updateTripArray(activeTrip.id, 'shoppingList', newList);
            };

            const handleDragEnd = () => {
                setDraggedItem(null);
            };

            const moveItem = (index, direction) => {
                if (direction === 'up' && index === 0) return;
                if (direction === 'down' && index === list.length - 1) return;
                const newList = [...list];
                const swapIndex = direction === 'up' ? index - 1 : index + 1;
                [newList[index], newList[swapIndex]] = [newList[swapIndex], newList[index]];
                updateTripArray(activeTrip.id, 'shoppingList', newList);
            };

            return (
                <div className="p-6 md:p-10 max-w-4xl mx-auto space-y-6 pb-32">
                    <div className="flex justify-between items-center mb-2">
                        <h2 className="text-2xl font-bold text-[#2D3436] dark:text-white">購物清單</h2>
                        <Button onClick={() => handleOpenModal()} className="rounded-full px-4"><Plus size={18}/> 新增</Button>
                    </div>

                    <MobileDragHint />
                    
                    <GlassCard className="p-6 min-h-[300px]">
                        <form onSubmit={addItem} className="flex gap-2 mb-6">
                            <input value={newItem} onChange={e => setNewItem(e.target.value)} placeholder="快速新增項目... (詳細資訊可點擊右側新增)" className="flex-1 bg-gray-50 dark:bg-gray-700 dark:text-white border border-gray-200 dark:border-gray-600 rounded-2xl px-4 py-2 outline-none focus:ring-2 focus:ring-[var(--primary)]"/>
                            <Button type="submit"><Plus size={18}/></Button>
                        </form>
                        <div className="space-y-2">
                            {list.map((item, index) => (
                                <div 
                                    key={item.id} 
                                    draggable 
                                    onDragStart={(e) => handleDragStart(e, index)}
                                    onDragOver={(e) => handleDragOver(e, index)}
                                    onDragEnd={handleDragEnd}
                                    className={`flex items-start gap-3 p-3 hover:bg-gray-50 dark:hover:bg-gray-700 rounded-2xl group cursor-pointer transition-all duration-300 border border-transparent hover:border-gray-200 dark:hover:border-gray-600 ${draggedItem === index ? 'opacity-50 scale-95' : 'opacity-100'}`} 
                                    onClick={() => toggleItem(item.id)}
                                >
                                    <div className="flex flex-col items-center justify-center text-gray-300 shrink-0 mt-0.5" onMouseDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()}>
                                        <button onClick={() => moveItem(index, 'up')} disabled={index === 0} className="p-0.5 hover:text-[var(--primary)] md:hidden disabled:opacity-30 disabled:hover:text-gray-300"><ChevronUp size={18}/></button>
                                        <GripVertical size={16} className="hidden md:block cursor-move hover:text-gray-500" />
                                        <button onClick={() => moveItem(index, 'down')} disabled={index === list.length - 1} className="p-0.5 hover:text-[var(--primary)] md:hidden disabled:opacity-30 disabled:hover:text-gray-300"><ChevronDown size={18}/></button>
                                    </div>
                                    <div className={`mt-1.5 w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 ${item.completed ? 'bg-[var(--primary)] border-[var(--primary)] text-white' : 'border-gray-300 dark:border-gray-500'}`}>{item.completed && <Check size={12}/>}</div>
                                    
                                    {item.image && (
                                        <div 
                                          className="w-12 h-12 rounded-xl overflow-hidden bg-gray-100 shrink-0 border border-gray-200 cursor-zoom-in group/img relative mt-0.5"
                                          onClick={(e) => { e.stopPropagation(); setFullScreenImage(item.image); }}
                                        >
                                            <img src={item.image} className="w-full h-full object-cover" alt="item" />
                                            <div className="absolute inset-0 bg-black/0 group-hover/img:bg-black/20 transition-colors flex items-center justify-center">
                                                <span className="opacity-0 group-hover/img:opacity-100 text-white text-[10px]">預覽</span>
                                            </div>
                                        </div>
                                    )}

                                    <div className="flex-1 min-w-0 pt-0.5">
                                        <div className={`flex items-center gap-2 ${item.completed ? 'text-gray-400 line-through' : 'text-gray-800 dark:text-gray-200 font-medium'}`}>
                                            {item.item}
                                        </div>
                                        {item.notes && <p className="text-xs text-gray-500 dark:text-gray-400 mt-0.5 line-clamp-2">{item.notes}</p>}
                                    </div>

                                    <div className="flex gap-1 pt-0.5" onClick={e => e.stopPropagation()}>
                                        <button onClick={() => handleOpenModal(item)} className="p-1.5 text-gray-400 hover:text-[var(--primary)] hover:bg-[rgba(var(--primary-rgb),0.1)] rounded-lg transition-colors"><Pencil size={16}/></button>
                                        <button onClick={() => deleteItem(item.id)} className="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors"><Trash2 size={16}/></button>
                                    </div>
                                </div>
                            ))}
                            {list.length === 0 && <p className="text-center text-gray-400 mt-10">清單是空的，快去新增吧！</p>}
                        </div>
                    </GlassCard>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-black/30 backdrop-blur-sm" onClick={handleCloseModal}>
                            <div className="bg-white dark:bg-gray-800 rounded-3xl w-full max-w-sm p-6 shadow-2xl animate-in fade-in zoom-in duration-200" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold dark:text-white">{editingItem ? '編輯商品' : '新增商品'}</h3>
                                    <button onClick={handleCloseModal} className="text-gray-400 hover:text-gray-600"><X size={20}/></button>
                                </div>
                                <form onSubmit={handleSaveItem} className="space-y-4">
                                    <div 
                                        className="relative w-full h-32 rounded-2xl overflow-hidden bg-gray-50 dark:bg-gray-700 border-2 border-dashed border-gray-200 dark:border-gray-600 hover:border-[var(--primary)] cursor-pointer transition-colors flex flex-col items-center justify-center text-gray-400 hover:text-[var(--primary)]"
                                        onClick={() => fileInputRef.current?.click()}
                                    >
                                        {previewImage ? (
                                            <>
                                                <img src={previewImage} className="w-full h-full object-cover" alt="preview" />
                                                <div className="absolute inset-0 bg-black/30 flex items-center justify-center text-white opacity-0 hover:opacity-100 transition-opacity"><Upload size={20}/></div>
                                            </>
                                        ) : (
                                            <>
                                                <ImageIcon size={24} className="mb-2"/>
                                                <span className="text-xs">點擊上傳圖片 (選填)</span>
                                            </>
                                        )}
                                        <input type="file" ref={fileInputRef} onChange={handleImageChange} accept="image/*" className="hidden" />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">商品名稱</label>
                                        <input name="item" defaultValue={editingItem?.item} placeholder="例如: EVE止痛藥" required className="w-full border dark:border-gray-700 dark:bg-gray-700 dark:text-white rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-[var(--primary)]"/>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">備註</label>
                                        <textarea name="notes" defaultValue={editingItem?.notes} placeholder="例如: 買藍色包裝的..." rows="2" className="w-full border dark:border-gray-700 dark:bg-gray-700 dark:text-white rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-[var(--primary)] resize-none"></textarea>
                                    </div>

                                    <div className="flex gap-3 mt-4">
                                        <Button variant="outline" type="button" className="flex-1 justify-center" onClick={handleCloseModal}>取消</Button>
                                        <Button type="submit" className="flex-1 justify-center">儲存</Button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const FoodList = () => {
            const { activeTrip, setFullScreenImage } = useContext(AppContext);
            if (!activeTrip) return null;

            ).sort((a, b) => new Date(a.date) - new Date(b.date) || a.time.localeCompare(b.time));

            const savedFoodItems = activeTrip.savedPlaces 
                ? Object.entries(activeTrip.savedPlaces).flatMap(([category, items]) => 
                    items.filter(act => act.type === 'Food').map(act => ({ ...act, category }))
                  )
                : [];

            const renderFoodCard = (item, isSaved) => (
                <GlassCard key={item.id} className="p-4 flex flex-col sm:flex-row gap-4 group">
                    <div className="w-12 h-12 rounded-2xl bg-orange-100 dark:bg-orange-900/30 text-orange-500 flex items-center justify-center shrink-0">
                        <Utensils size={24} />
                    </div>
                    <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2 mb-1">
                            {isSaved ? (
                                <span className="px-2 py-0.5 text-[10px] rounded-full bg-gray-100 text-gray-500 dark:bg-gray-700 dark:text-gray-300 font-bold border border-gray-200 dark:border-gray-600">📍 備用: {item.category}</span>
                            ) : (
                                <>
                                    <span className="px-2 py-0.5 text-[10px] rounded-full bg-[rgba(var(--primary-rgb),0.1)] text-[var(--primary)] font-bold">Day {item.dayId}</span>
                                    <span className="text-xs text-gray-500 dark:text-gray-400">{formatDateDisplay(item.date)}</span>
                                    <span className="text-xs text-gray-400 font-mono">{item.time}</span>
                                </>
                            )}
                        </div>
                        <h4 className="font-bold text-lg text-gray-800 dark:text-gray-100 truncate">{item.location}</h4>
                        {item.address && (
                            <p className="text-sm text-gray-500 dark:text-gray-400 flex items-start gap-1 mt-1">
                                <MapPin size={14} className="shrink-0 mt-0.5" />
                                <span className="line-clamp-2">{item.address}</span>
                            </p>
                        )}
                        {item.operatingHours && (
                            <p className="text-xs text-gray-500 dark:text-gray-400 flex items-center gap-1 mt-1">
                                <Clock size={12} className="shrink-0" />
                                <span>營業時間: {item.operatingHours}</span>
                            </p>
                        )}
                        {item.notes && <p className="text-sm text-gray-600 dark:text-gray-300 mt-2 p-2 bg-gray-50 dark:bg-gray-800/50 rounded-lg whitespace-pre-wrap border border-gray-100 dark:border-gray-700">{item.notes}</p>}
                        
                        {item.attachment && (
                            <div 
                                className="mt-3 w-24 h-24 rounded-xl overflow-hidden border border-gray-100 dark:border-gray-700 cursor-zoom-in relative group/img"
                                onClick={(e) => { e.stopPropagation(); setFullScreenImage(item.attachment); }}
                            >
                                <img src={item.attachment} className="w-full h-full object-cover group-hover/img:scale-105 transition-transform" alt="attachment" />
                                <div className="absolute inset-0 bg-black/0 group-hover/img:bg-black/20 transition-colors flex items-center justify-center">
                                    <span className="opacity-0 group-hover/img:opacity-100 text-white text-xs bg-black/50 px-2 py-1 rounded-lg">放大</span>
                                </div>
                            </div>
                        )}
                    </div>
                    <div className="flex sm:flex-col items-center justify-center sm:justify-end gap-2 shrink-0 border-t sm:border-t-0 sm:border-l border-gray-100 dark:border-gray-700 pt-3 sm:pt-0 sm:pl-4">
                        {item.link && (
                            <a href={item.link} target="_blank" rel="noreferrer" className="w-full text-center px-4 py-2 bg-gray-100 hover:bg-[var(--primary)] hover:text-white dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-[var(--primary)] dark:hover:text-white text-sm font-medium rounded-xl transition-colors whitespace-nowrap">
                                查看餐廳
                            </a>
                        )}
                        {(item.mapLink || (item.link && item.link.includes('maps'))) && (
                            <a href={item.mapLink || item.link} target="_blank" rel="noreferrer" className="w-full text-center px-4 py-2 bg-gray-100 hover:bg-[#4D96FF] hover:text-white dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-[#4D96FF] dark:hover:text-white text-sm font-medium rounded-xl transition-colors flex items-center justify-center gap-1 whitespace-nowrap">
                                <MapPin size={14}/> 導航
                            </a>
                        )}
                    </div>
                </GlassCard>
            );

            return (
                <div className="p-6 md:p-10 max-w-4xl mx-auto space-y-10 pb-32">
                    <div className="flex justify-between items-center mb-2">
                        <div>
                            <h2 className="text-3xl font-black text-[#2D3436] dark:text-white tracking-tight">美食地圖</h2>
                            <p className="text-gray-500 text-sm mt-1 font-medium">行程中與備用的所有餐廳</p>
                        </div>
                    </div>
                    
                    <div className="space-y-4">
                        <h3 className="font-bold text-gray-700 dark:text-gray-300 flex items-center gap-2 border-b border-gray-200 dark:border-gray-700 pb-2"><CalendarCheck size={18}/> 行程中的美食</h3>
                        {scheduledFoodItems.length === 0 ? (
                            <div className="text-center text-gray-400 py-10 border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-800/50">尚無美食行程</div>
                        ) : (
                            <div className="grid gap-4">
                                {scheduledFoodItems.map(item => renderFoodCard(item, false))}
                            </div>

                    </div>

                    {savedFoodItems.length > 0 && (
                        <div className="space-y-4 pt-4">
                            <h3 className="font-bold text-gray-700 dark:text-gray-300 flex items-center gap-2 border-b border-gray-200 dark:border-gray-700 pb-2"><ShoppingBag size={18}/> 備用與願望清單</h3>
                            <div className="grid gap-4">
                                {savedFoodItems.map(item => renderFoodCard(item, true))}
                            </div>
                        </div>
                    )}

            );

        const SettingsPage = () => {
            const { activeTrip, deleteTrip, updateTrip, setCurrentView, setActiveTripId, data, updateThemeColor, updateSettings } = useContext(AppContext);
            const [previewImage, setPreviewImage] = useState(activeTrip.coverImage);
            const [isProcessing, setIsProcessing] = useState(false);
            const fileInputRef = useRef(null);

            const handleImageChange = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    setIsProcessing(true);
                    try {
                        const base64 = await processImageUpload(file);
                        setPreviewImage(base64);
                        updateTrip(activeTrip.id, { coverImage: base64 });
                    } catch (err) {
                        console.error("Image processing failed", err);
                        alert("圖片處理失敗");
                    } finally {
                        setIsProcessing(false);
                    }
                }
            };

            const handleSaveDate = (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                updateTrip(activeTrip.id, {
                    title: fd.get('title'),
                    startDate: fd.get('startDate'),
                    endDate: fd.get('endDate')
                });
                alert("設定已更新！");
            };

            const handleDelete = () => {
                if(confirm("確定要刪除此旅程嗎？此操作無法復原。")) {
                    deleteTrip(activeTrip.id);
                    setActiveTripId(null);
                    setCurrentView('dashboard');
                }
            };

            return (
                <div className="p-6 md:p-10 max-w-2xl mx-auto space-y-8 pb-32">
                    <h2 className="text-2xl font-bold text-[#2D3436] dark:text-white">旅程設置</h2>
                    
                    <section className="space-y-4">
                        <h3 className="font-bold text-gray-700 dark:text-gray-300 flex items-center gap-2"><Palette size={18}/> 顯示設定</h3>
                        
                        <div className="mt-2">
                            <label className="text-sm text-gray-500 dark:text-gray-400 mb-2 block">主題顏色</label>
                            <div className="grid grid-cols-3 md:grid-cols-6 gap-3">
                                {THEME_PRESETS.map(theme => (
                                    <button key={theme.color} onClick={() => updateThemeColor(theme.color)} className={`flex flex-col items-center gap-2 p-2 rounded-2xl border transition-all ${data.themeColor === theme.color ? 'border-[var(--primary)] bg-[rgba(var(--primary-rgb),0.1)]' : 'border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700'}`}>
                                        <div className="w-8 h-8 rounded-full shadow-sm" style={{ backgroundColor: theme.color }} />
                                        <span className="text-xs text-gray-600 dark:text-gray-300">{theme.name}</span>
                                    </button>
                                ))}
                                <label className={`flex flex-col items-center gap-2 p-2 rounded-2xl border border-gray-100 dark:border-gray-700 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700`}>
                                    <div className="w-8 h-8 rounded-full shadow-sm bg-gradient-to-br from-red-400 to-blue-400 flex items-center justify-center text-white"><Plus size={14} /></div>
                                    <span className="text-xs text-gray-600 dark:text-gray-300">自訂</span>
                                    <input type="color" value={data.themeColor} onChange={(e) => updateThemeColor(e.target.value)} className="absolute opacity-0 w-0 h-0"/>
                                </label>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="flex flex-col justify-center p-4 rounded-3xl border border-gray-100 dark:border-gray-700 bg-white dark:bg-gray-800 gap-3">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-3"><div className="p-2 bg-gray-100 dark:bg-gray-700 rounded-full text-gray-600 dark:text-gray-300"><Type size={20} /></div><span className="font-medium text-gray-700 dark:text-gray-200">字體大小</span></div>
                                    <span className="text-xs font-bold text-[var(--primary)]">{data.settings?.fontSize || 16}px</span>
                                </div>
                                <div className="flex items-center gap-3">
                                    <span className="text-xs text-gray-400">12</span>
                                    <input type="range" min="12" max="36" step="1" value={data.settings?.fontSize || 16} onChange={(e) => updateSettings('fontSize', parseInt(e.target.value))} className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer dark:bg-gray-700 accent-[var(--primary)]"/>
                                    <span className="text-xs text-gray-400">36</span>
                                </div>
                            </div>

                            <div className="flex items-center justify-between p-4 rounded-3xl border border-gray-100 dark:border-gray-700 bg-white dark:bg-gray-800">
                                <div className="flex items-center gap-3"><div className="p-2 bg-gray-100 dark:bg-gray-700 rounded-full text-gray-600 dark:text-gray-300"><Moon size={20} /></div><span className="font-medium text-gray-700 dark:text-gray-200">深色模式</span></div>
                                <label className="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" className="sr-only peer" checked={data.settings?.darkMode || false} onChange={(e) => updateSettings('darkMode', e.target.checked)}/>
                                    <div className="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[var(--primary)]"></div>

                    <section className="space-y-4 pt-4 border-t border-gray-100 dark:border-gray-700">

                        <form onSubmit={handleSaveDate} className="space-y-4">
                            <div className="space-y-1">
                                <label className="text-sm text-gray-500 dark:text-gray-400">旅程名稱</label>
                                <input name="title" defaultValue={activeTrip.title} className="w-full border dark:border-gray-600 dark:bg-gray-800 dark:text-white p-2 rounded-xl outline-none focus:border-[var(--primary)] focus:ring-1 focus:ring-[var(--primary)]"/>
                            </div>

          const { data, addTrip, deleteTrip, setActiveTripId, setCurrentView } = useContext(AppContext);

                date: currentDayDate.toISOString().split('T')[0],

                temp: '15°C / 22°C',
                activities: []
              };

            addTrip({
              id: crypto.randomUUID(),
              title: formData.get('title'),
              startDate,
              endDate,
              status: 'planning',
              coverImage: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&q=80&w=1000',
              dailyItinerary: itinerary,

              <div className="mt-12 bg-[rgba(var(--primary-rgb),0.05)] p-6 rounded-3xl border border-[rgba(var(--primary-rgb),0.2)] flex gap-4 items-start max-w-lg mx-auto">
                <div className="p-3 bg-[var(--primary)] rounded-full text-white shrink-0 shadow-lg shadow-[var(--primary)]/30"><Sparkles size={20}/></div>
                <div>
                    <h4 className="text-[var(--primary)] font-bold mb-1">每日靈感</h4>
                    <p className="text-sm text-gray-600 dark:text-gray-300 leading-relaxed">「一期一會」<br/>把每一次相遇都當作一生只有一次的緣分來珍惜。</p>
                </div>
              </div>

              {showCreateModal && (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/30 backdrop-blur-sm">
                  <div className="bg-[#FFFFFF] dark:bg-gray-800 rounded-3xl w-full max-w-md p-6 shadow-2xl animate-in fade-in zoom-in duration-200">
                    <h3 className="text-xl font-bold mb-4 text-[#2D3436] dark:text-white">新增旅程</h3>
                    <form onSubmit={handleCreate} className="space-y-4">
                      <div><label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">旅程名稱</label><input name="title" required placeholder="例如：京都紅葉狩" className="w-full border dark:border-gray-600 dark:bg-gray-700 dark:text-white border-gray-200 rounded-xl p-2.5 focus:ring-2 focus:ring-[var(--primary)] outline-none" /></div>
                      <div className="grid grid-cols-2 gap-4">
                        <div><label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">開始日期</label><input type="date" name="startDate" required className="w-full border dark:border-gray-600 dark:bg-gray-700 dark:text-white border-gray-200 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-[var(--primary)]" /></div>
                        <div><label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">結束日期</label><input type="date" name="endDate" required className="w-full border dark:border-gray-600 dark:bg-gray-700 dark:text-white border-gray-200 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-[var(--primary)]" /></div>

                      <div className="flex gap-3 mt-6"><Button variant="outline" type="button" className="flex-1 justify-center" onClick={() => setShowCreateModal(false)}>取消</Button><Button type="submit" className="flex-1 justify-center">建立</Button></div>
